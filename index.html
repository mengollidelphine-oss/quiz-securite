<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quel gardien de la sécurité es-tu ? 🇧🇪</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --police:      #1a3a6b;
      --defense:     #3d5a2a;
      --pompiers:    #b03020;
      --gardiennage: #2c3e50;
      --gold:        #f39c12;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(26,58,107,.35) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(176,48,32,.25) 0%, transparent 50%),
        radial-gradient(ellipse at 55% 85%, rgba(61,90,42,.25) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── SCREENS ─────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 20px;
      animation: fadeUp .4s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── INTRO ───────────────────────────────────── */
    #screen-intro {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
    }

    .be-flag {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .be-flag span {
      display: block;
      width: 13px; height: 52px;
      border-radius: 4px;
    }
    .be-flag .bl { background: #111; }
    .be-flag .ye { background: #F8D030; }
    .be-flag .re { background: #EF3340; }

    .intro-icon {
      font-size: 78px;
      display: block;
      animation: bob 2.6s ease-in-out infinite;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.5));
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-8px) scale(1.06); }
    }

    .intro-title {
      font-size: 27px;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }

    .intro-sub {
      font-size: 15px;
      color: rgba(255,255,255,.7);
      max-width: 310px;
      line-height: 1.55;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .pill {
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-police      { background: var(--police); }
    .pill-defense     { background: var(--defense); }
    .pill-pompiers    { background: var(--pompiers); }
    .pill-gardiennage { background: var(--gardiennage); border: 1px solid rgba(255,255,255,.2); }

    .btn {
      padding: 15px 32px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.4);
      width: 100%;
      justify-content: center;
    }
    .btn:active { transform: scale(.96); }

    .btn-start {
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: #fff;
      font-size: 20px;
    }
    .btn-replay {
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: #fff;
    }
    .btn-share {
      background: rgba(255,255,255,.12);
      color: #fff;
      border: 2px solid rgba(255,255,255,.3);
      backdrop-filter: blur(10px);
    }

    .intro-footer {
      font-size: 11px;
      color: rgba(255,255,255,.28);
      text-align: center;
    }

    /* ── QUIZ ────────────────────────────────────── */
    #screen-quiz {
      gap: 18px;
      padding-top: 38px;
    }

    .prog-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .prog-label {
      font-size: 13px;
      color: rgba(255,255,255,.55);
      white-space: nowrap;
    }
    .prog-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,.12);
      border-radius: 4px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #f39c12, #e74c3c);
      border-radius: 4px;
      transition: width .55s ease;
    }

    .q-card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding: 26px 20px;
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .q-icon  { font-size: 42px; display: block; margin-bottom: 10px; }
    .q-text  { font-size: 18px; font-weight: 700; color: #fff; line-height: 1.4; }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .ans-btn {
      background: rgba(255,255,255,.08);
      border: 2px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 15px 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .22s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-height: 88px;
      justify-content: center;
      text-align: center;
      line-height: 1.35;
    }
    .ans-btn:active { transform: scale(.96); }
    .ans-btn:hover  {
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.35);
      transform: translateY(-2px);
    }
    .ans-btn.picked {
      border-color: var(--gold);
      background: rgba(243,156,18,.22);
    }
    .ans-emoji { font-size: 27px; display: block; }

    /* ── RESULT ──────────────────────────────────── */
    #screen-result {
      align-items: center;
      gap: 18px;
      padding-bottom: 30px;
    }

    .res-header { text-align: center; }
    .res-header h2 {
      font-size: 14px;
      color: rgba(255,255,255,.55);
      font-weight: 400;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .res-header h1 {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
    }

    .res-card {
      width: 100%;
      border-radius: 26px;
      padding: 28px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .res-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.13), transparent 65%);
      pointer-events: none;
    }

    .res-big-emoji {
      font-size: 82px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,.45));
      animation: bounceIn .55s cubic-bezier(.36,.07,.19,.97);
    }
    @keyframes bounceIn {
      0%   { transform: scale(0) rotate(-10deg); }
      65%  { transform: scale(1.18) rotate(3deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .res-name    { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .res-tagline { font-size: 14px; color: rgba(255,255,255,.8); font-style: italic; margin-bottom: 14px; }
    .res-divider { width: 38px; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; margin: 14px auto; }
    .res-desc    { font-size: 13.5px; color: rgba(255,255,255,.9); line-height: 1.6; text-align: left; }

    .res-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-top: 12px;
    }
    .res-tag {
      background: rgba(255,255,255,.2);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #fff;
      font-weight: 600;
    }

    .fact-box {
      background: rgba(0,0,0,.22);
      border-radius: 12px;
      padding: 11px 13px;
      margin-top: 14px;
      text-align: left;
    }
    .fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.5); margin-bottom: 4px; }
    .fact-text  { font-size: 13px; color: rgba(255,255,255,.82); line-height: 1.5; }

    /* Score bars */
    .scores-section { width: 100%; }
    .scores-title {
      font-size: 12px;
      color: rgba(255,255,255,.45);
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }
    .score-lbl {
      font-size: 12.5px;
      color: rgba(255,255,255,.7);
      width: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .score-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .score-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 1.1s ease;
    }
    .score-pct {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      width: 30px;
      text-align: right;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* Confetti */
    .cf {
      position: fixed;
      border-radius: 2px;
      pointer-events: none;
      animation: cfFall linear forwards;
    }
    @keyframes cfFall {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ══════════ INTRO ══════════ -->
  <div id="screen-intro" class="screen active">
    <div class="be-flag">
      <span class="bl"></span><span class="ye"></span><span class="re"></span>
    </div>

    <span class="intro-icon">🔐</span>

    <h1 class="intro-title">Quel gardien de la sécurité es-tu ?</h1>

    <p class="intro-sub">
      10 questions de personnalité pour découvrir quel métier de la sécurité belge te correspond le mieux !
    </p>

    <div class="pills">
      <span class="pill pill-police">👮 Police</span>
      <span class="pill pill-defense">🪖 Défense</span>
      <span class="pill pill-pompiers">🚒 Pompiers</span>
      <span class="pill pill-gardiennage">🛡️ Gardiennage</span>
    </div>

    <button class="btn btn-start" onclick="startQuiz()">▶&nbsp; Démarrer le quiz</button>

    <p class="intro-footer">Journée Portes Ouvertes &nbsp;•&nbsp; 🇧🇪 Belgique</p>
  </div>

  <!-- ══════════ QUIZ ══════════ -->
  <div id="screen-quiz" class="screen">
    <div class="prog-row">
      <span class="prog-label" id="prog-label">1 / 10</span>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:10%"></div></div>
    </div>

    <div class="q-card" id="q-card">
      <span class="q-icon" id="q-icon"></span>
      <p  class="q-text" id="q-text"></p>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- ══════════ RESULT ══════════ -->
  <div id="screen-result" class="screen">
    <div class="res-header">
      <h2>Ton profil de sécurité</h2>
      <h1 id="res-title"></h1>
    </div>

    <div class="res-card" id="res-card">
      <span class="res-big-emoji" id="res-emoji"></span>
      <div class="res-name"    id="res-name"></div>
      <div class="res-tagline" id="res-tagline"></div>
      <div class="res-divider"></div>
      <div class="res-desc"    id="res-desc"></div>
      <div class="res-tags"    id="res-tags"></div>
      <div class="fact-box">
        <div class="fact-label">📌 Le savais-tu ?</div>
        <div class="fact-text" id="res-fact"></div>
      </div>
    </div>

    <div class="scores-section">
      <div class="scores-title">Ton profil complet</div>
      <div id="scores-bars"></div>
    </div>

    <div class="result-actions">
      <button class="btn btn-replay" onclick="restartQuiz()">🔄&nbsp; Rejouer</button>
      <button class="btn btn-share"  onclick="shareResult()">📤&nbsp; Partager mon résultat</button>
    </div>
  </div>

</div><!-- /container -->

// ─── DATA ────────────────────────────────────────────────────────────────────

// ─── STATE ───────────────────────────────────────────────────────────────────

let currentQ = 0;
let scores   = { police: 0, defense: 0, pompiers: 0, gardiennage: 0 };

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

// ─── QUIZ LOGIC ──────────────────────────────────────────────────────────────

function startQuiz() {
  currentQ = 0;
  scores   = { police: 0, defense: 0, pompiers: 0, gardiennage: 0 };
  locked   = false;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  locked = false;
  const q   = QUESTIONS[currentQ];
  const idx = currentQ + 1;
  const tot = QUESTIONS.length;

  document.getElementById('prog-label').textContent = `${idx} / ${tot}`;
  document.getElementById('prog-fill').style.width  = `${(idx / tot) * 100}%`;
  document.getElementById('q-icon').textContent     = q.icon;
  document.getElementById('q-text').textContent     = q.text;

  const grid = document.getElementById('answers');
  grid.innerHTML = '';

  shuffle(q.answers).forEach(ans => {
    const btn = document.createElement('button');
    btn.className   = 'ans-btn';
    btn.innerHTML   = `<span class="ans-emoji">${ans.emoji}</span>${ans.text}`;
    btn.onclick     = () => pick(btn, ans.prof);
    grid.appendChild(btn);
  });
}

function pick(btn, prof) {
  if (locked) return;
  locked = true;
  btn.classList.add('picked');
  scores[prof]++;
  setTimeout(() => {
    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 420);
}

// ─── RESULT ──────────────────────────────────────────────────────────────────

function showResult() {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const winner = sorted[0][0];
  const p      = PROFESSIONS[winner];
  const total  = QUESTIONS.length;

  document.getElementById('res-title').textContent  = 'Tu es fait(e) pour ça !';
  document.getElementById('res-emoji').textContent  = p.emoji;
  document.getElementById('res-name').textContent   = p.name;
  document.getElementById('res-tagline').textContent= p.tagline;
  document.getElementById('res-desc').textContent   = p.desc;
  document.getElementById('res-fact').textContent   = p.fact;

  document.getElementById('res-tags').innerHTML =
    p.tags.map(t => `<span class="res-tag">${t}</span>`).join('');

  document.getElementById('res-card').style.background = p.gradient;

  // score bars
  const barsEl = document.getElementById('scores-bars');
  barsEl.innerHTML = '';
  sorted.forEach(([key, score]) => {
    const pr  = PROFESSIONS[key];
    const pct = Math.round((score / total) * 100);
    barsEl.innerHTML += `
      <div class="score-row">
        <div class="score-lbl">${pr.emoji} ${pr.name.split(' ')[0]}</div>
        <div class="score-track">
          <div class="score-bar" style="width:${pct}%;background:${pr.barColor}"></div>
        </div>
        <div class="score-pct">${pct}%</div>
      </div>`;
  });

  showScreen('result');
  confetti();
}

function restartQuiz() { startQuiz(); }

function shareResult() {
  const winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  const p      = PROFESSIONS[winner];
  const text   = `🇧🇪 Quiz Sécurité Belge\nMon profil : ${p.emoji} ${p.name}\n${p.tagline}\n\nDécouvre le tien !`;

  if (navigator.share) {
    navigator.share({ title: 'Quel gardien de la sécurité es-tu ?', text }).catch(() => copy(text));
  } else {
    copy(text);
  }
}

function copy(text) {
  navigator.clipboard.writeText(text)
    .then(()  => alert('Résultat copié dans le presse-papier ! 📋'))
    .catch(()  => alert('Partage non disponible sur cet appareil.'));
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────

function confetti() {
  const palette = ['#F8D030','#EF3340','#000','#3498db','#e74c3c','#6daa3a','#fff'];
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el   = document.createElement('div');
      el.className = 'cf';
      el.style.cssText = `
        left:${Math.random()*100}vw; top:-12px;
        width:${6 + Math.random()*8}px; height:${6 + Math.random()*8}px;
        background:${palette[Math.floor(Math.random()*palette.length)]};
        animation-duration:${1.4 + Math.random()*2.2}s;
        transform:rotate(${Math.random()*360}deg);
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 28);
  }
}
